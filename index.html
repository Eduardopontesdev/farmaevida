<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farma & Vida</title>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8f2;--card:#fff;--tx:#1d2b22;--mut:#66756b;--g:#1c7a3e;--gl:#e3f2e5;--line:#dfe8df;--rose:#fde8ec;--vio:#ece6fa;--blu:#e3eefc;--org:#fdeedd;--red:#c0392b}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101a14;--card:#18261d;--tx:#e8f2ea;--mut:#9bb0a2;--g:#4cb872;--gl:#1f3a28;--line:#2a3d31;--rose:#3a2128;--vio:#2a2540;--blu:#1f2d44;--org:#3d2f1d;--red:#ff7b6b}}
:root[data-theme=dark]{--bg:#101a14;--card:#18261d;--tx:#e8f2ea;--mut:#9bb0a2;--g:#4cb872;--gl:#1f3a28;--line:#2a3d31;--rose:#3a2128;--vio:#2a2540;--blu:#1f2d44;--org:#3d2f1d;--red:#ff7b6b}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Nunito,system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative}
main{flex:1;overflow-y:auto;padding:16px 16px 20px}
h1,h2{font-family:Fraunces,Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.brand{font-family:Fraunces,serif;font-size:32px;color:var(--g);line-height:1}
.sub{font-size:11px;color:var(--mut);letter-spacing:.04em}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:12px 0;width:100%}
.search input{flex:1;border:0;background:none;color:var(--tx);font:inherit;outline:0;min-width:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;font-size:11px;text-align:center;font-weight:600;display:flex;flex-direction:column;gap:4px;align-items:center}
.tile b{font-size:24px;font-weight:400}
.banner{margin-top:14px;background:var(--gl);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center}
.banner h2{font-size:16px;color:var(--g)}
.tabs{display:flex;gap:6px;margin:10px 0 12px;overflow-x:auto}
.tab{padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.card .t{flex:1;min-width:0}.card .t small{display:block;color:var(--mut);font-size:12px}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--gl);flex:none}
.btn{display:block;width:100%;background:var(--g);color:#fff;border-radius:14px;padding:13px;font-weight:700;text-align:center;margin-top:10px}
.btn.o{background:none;color:var(--g);border:1.5px solid var(--g)}
.btn:disabled{opacity:.45}
h3{font-size:15px;margin:16px 0 8px;display:flex;justify-content:space-between}
h3 button{color:var(--g);font-size:13px;font-weight:600}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--blu);color:#2a5fb0;white-space:nowrap}
.pill.ok{background:var(--gl);color:var(--g)}.pill.x{background:var(--rose);color:var(--red)}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--g)}.sw.on::after{left:21px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff}
.chk.on{background:var(--g);border-color:var(--g)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);padding:4px;position:relative}
nav button b{font-size:20px;font-weight:400;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--g);font-weight:700}nav button.on b{filter:none;opacity:1}
nav i{position:absolute;top:0;left:55%;background:var(--red);color:#fff;font-size:10px;font-style:normal;border-radius:99px;padding:0 5px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}.top h1{font-size:22px;flex:1}
.back{font-size:22px;padding:2px 8px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--mut);font-size:13px;width:100%}
.toast{position:absolute;left:16px;right:16px;bottom:80px;background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1}
.ov{position:absolute;inset:0;background:#0007;z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 24px}
.sheet h2{font-size:20px;margin-bottom:10px}
.form{display:flex;flex-direction:column;gap:8px}
.form input,.form select{padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;width:100%}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.q{display:flex;align-items:center;gap:8px}.q button{width:28px;height:28px;border-radius:50%;background:var(--gl);color:var(--g);font-weight:700}
.bar{display:flex;gap:6px;align-items:flex-end;height:80px;margin:8px 0}.bar div{flex:1;background:var(--g);border-radius:6px 6px 0 0;min-height:3px}
@media print{nav,.noprint,.top{display:none!important}html,body,#app{height:auto!important;display:block!important}main{overflow:visible!important;padding:0!important}body{background:#fff}.paper,.nota{border:0!important}}
.paper{background:#fff;color:#1d2b22;--tx:#1d2b22;--mut:#66756b;--line:#dfe8df;--g:#1c7a3e;--red:#c0392b;border-radius:12px;padding:18px 16px;border:1px solid var(--line)}
.paper .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--g);padding-bottom:10px}.paper .hd small{display:block;font-size:11px;color:var(--mut);text-align:right}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px;margin:12px 0;padding:10px;background:#f3f8f2;border-radius:8px}.pg small{display:block;color:var(--mut);font-size:11px}
.rw{display:grid;grid-template-columns:1.5fr 1fr .8fr 1.2fr;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.rw.h{font-size:11px;color:var(--mut);font-weight:700;border-bottom:2px solid var(--g)}
.sig{margin-top:26px;text-align:center;font-size:12px}.sig i{display:block;border-top:1px solid #1d2b22;width:60%;margin:0 auto 4px}
.nota{background:var(--card);border:1px dashed var(--mut);border-radius:12px;padding:16px;font-size:14px}.nota hr{border:0;border-top:1px dashed var(--line);margin:10px 0}.nota .l{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.nota h2{text-align:center;font-size:20px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"><main id="v"></main><div class="toast" id="toast" role="status"></div><nav id="nav"></nav></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const br=d=>d.split('-').reverse().join('/'),R=n=>'R$ '+n.toFixed(2).replace('.',',');
const DEF={name:'',theme:'',meds:[{id:'m1',n:'Losartana 50mg',d:'1 comprimido',t:['08:00','20:00'],on:1,i:'💊'},{id:'m2',n:'Metformina 850mg',d:'1 comprimido',t:['08:00','20:00'],on:1,i:'💊'},{id:'m3',n:'Vitamina D (Manipulado)',d:'1 cápsula',t:['08:00'],on:1,i:'🟡'},{id:'m4',n:'Ômega 3',d:'1 cápsula',t:['08:00'],on:1,i:'💊'}],hist:[],exams:[{id:'e1',n:'Hemograma Completo',date:'2026-10-10',r:'Hemoglobina 13,8 g/dL · Leucócitos 6.800/mm³ · Plaquetas 245 mil/mm³. Valores dentro da referência.'},{id:'e2',n:'Glicemia',date:'2026-10-10',r:'Glicemia de jejum: 92 mg/dL (referência 70–99).'}],cart:[],orders:[],appts:[],log:{},custom:[{id:'c1',n:'Água',d:'Beber 200 ml',t:'12:00',i:'💧'},{id:'c2',n:'Caminhada',d:'30 minutos',t:'15:00',i:'🏃'}],notifs:[]};
let S;try{S=JSON.parse(localStorage.getItem('fv2'))||structuredClone(DEF)}catch(e){S=structuredClone(DEF)}
S.labs=S.labs||[];

const CAT=[['Controlados','🔴','rose'],['Uso contínuo','🔵','blu'],['Manipulados','🟣','vio'],['Fitoterápicos','🌿','gl'],['Dermocosméticos','🌸','rose'],['Suplementos','🟠','org']];
const PROD=[['Clonazepam 2mg','Controlados',18.9,1],['Fluoxetina 20mg','Controlados',24.5,1],['Losartana 50mg','Uso contínuo',12.9],['Metformina 850mg','Uso contínuo',14.7],['Atenolol 25mg','Uso contínuo',9.8],['Sinvastatina 20mg','Uso contínuo',11.2],['Vitamina D manipulada','Manipulados',39],['Fórmula dermatológica','Manipulados',58],['Cápsulas de magnésio','Manipulados',44],['Valeriana 300mg','Fitoterápicos',27.5],['Camomila em cápsulas','Fitoterápicos',22],['Hipérico 300mg','Fitoterápicos',31],['Protetor solar FPS 50','Dermocosméticos',54.9],['Sérum vitamina C','Dermocosméticos',89],['Ômega 3','Suplementos',36.9],['Colágeno hidrolisado','Suplementos',64]];
const SVC=[['👩‍⚕️','Consulta Farmacêutica','Acompanhamento do uso de medicamentos, revisão da terapia e orientação em saúde.','Farmácia Clínica'],['❤️','Acompanhamento de Doenças Crônicas','Diabetes, hipertensão, colesterol, asma, etc.','Farmácia Clínica'],['💊','Ajuste de Tratamento Farmacoterapêutico','Segurança e melhores resultados.','Farmácia Clínica'],['🍎','Acompanhamento Nutricional','Em parceria com profissionais da área.','Farmácia Clínica'],['🌿','Consulta de Fitoterapia','Uso de plantas medicinais e orientação terapêutica.','Fitoterapia'],['🌸','Consulta Estética','Avaliação da pele, protocolos estéticos e cuidados personalizados.','Estética']];
const PR={'Consulta Farmacêutica':80,'Acompanhamento de Doenças Crônicas':90,'Ajuste de Tratamento Farmacoterapêutico':90,'Acompanhamento Nutricional':120,'Consulta de Fitoterapia':70,'Consulta Estética':110},MT={pix:'Pix',card:'Cartão de crédito',cash:'Dinheiro',clinic:'Pagar na clínica'};
const LABS=[['Hemograma completo',25,'sem jejum'],['Glicemia de jejum',12,'jejum de 8 h'],['Perfil lipídico',45,'jejum de 12 h'],['Hemoglobina glicada',30,'sem jejum'],['TSH e T4 livre',55,'sem jejum'],['Ureia e creatinina',22,'jejum de 4 h'],['TGO e TGP',28,'jejum de 8 h'],['Vitamina D',65,'sem jejum'],['Ferritina',35,'jejum de 4 h'],['Urina tipo 1',15,'primeiro jato da manhã']],LS=['07:00','08:00','09:00','10:00','11:00','14:00','16:00'];
const SLOTS=['09:00','10:30','14:00','15:30','17:00'];
let V={an:{sel:[],mode:'loja',addr:'',date:'',time:''},tab:'inicio',scr:'inicio',ped:{cat:'',q:''},age:'Farmácia Clínica',meds:'Uso Contínuo',ex:'Exames',lem:'Hoje',rx:''};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2400)};
const notify=m=>{S.notifs.unshift({id:uid(),m,ts:Date.now(),r:0});save()};
const modal=h=>{close();const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=e=>{if(e.target==o)close()};o.innerHTML='<div class="sheet" role="dialog">'+h+'</div>';$('#app').append(o)};
const close=()=>{const o=$('#ov');o&&o.remove()};
const nav=(s,t)=>{V.scr=s;V.tab=t||V.tab;render()};
const head=(t,b)=>`<div class="top">${b?`<button class="back" aria-label="Voltar" onclick="nav('${b}')">‹</button>`:''}<h1>${t}</h1></div>`;
const tabs=(k,arr)=>`<div class="tabs">${arr.map(a=>`<button class="tab ${V[k]==a?'on':''}" onclick="V['${k}']='${a}';render()">${a}</button>`).join('')}</div>`;
const cartN=()=>S.cart.reduce((a,c)=>a+c.q,0),unread=()=>S.notifs.filter(n=>!n.r).length;
const prodPrice=n=>(PROD.find(p=>p[0]==n)||[0,0,0])[2];
function orderStatus(o){const m=(Date.now()-o.ts)/6e4;return m<1?'Em preparo':m<3?(o.mode=='entrega'?'A caminho':'Pronto p/ retirada'):'Entregue'}
const NAV=[['inicio','🏠','Início'],['pedidos','🛒','Pedidos'],['consultas','📅','Consultas'],['notif','🔔','Notificações'],['perfil','👤','Perfil']];
const SCR={
inicio(){const T=[['🛒','Encomendar Medicamentos','pedidos'],['💊','Meus Medicamentos','meds'],['📅','Agendar Consultas','consultas'],['📄','Meus Laudos e Exames','ex'],['🩺','Farmácia Clínica','consultas'],['🔬','Análises Clínicas','an'],['⚗️','Manipulação','man'],['🌿','Fitoterapia','fito'],['💆','Estética','est'],['💓','Acompanhamento Terapêutico','meds'],['⏰','Lembretes do Dia','lem'],['⋯','Mais Serviços','mais']];
return `<button class="back" style="float:right" aria-label="Fechar aplicativo" onclick="askClose()">✕</button><h1 style="font-size:22px">Olá, ${esc(S.name)}!</h1><p class="sub" style="font-size:13px;letter-spacing:0">Cuidar de você é o nosso propósito!</p>
<div style="text-align:center;margin:16px 0 0"><div class="brand">Farma <span style="color:#7aa84a">&amp;</span> <i>Vida</i></div><div class="sub">SAÚDE EM TODAS AS FASES DA VIDA</div></div>
<label class="search">🔍<input id="q" placeholder="O que você precisa hoje?" oninput="busca(this.value)"></label><div id="res"></div>
<div class="grid">${T.map(t=>`<button class="tile" onclick="tile('${t[2]}')"><b>${t[0]}</b>${t[1]}</button>`).join('')}</div>
<div class="banner"><div style="flex:1"><h2>Cuidado completo para você e sua família</h2><div class="sub" style="margin-top:6px">💚 Saúde · Bem-estar · Qualidade de vida</div></div><span style="font-size:44px">👩‍⚕️</span></div>`},
pedidos(){const p=V.ped,L=PROD.filter(x=>(!p.cat||x[1]==p.cat)&&x[0].toLowerCase().includes(p.q.toLowerCase()));
const ords=S.orders.slice(0,3);
return `<div class="top"><h1>Encomendar Medicamentos</h1><button class="tab on" onclick="nav('cart')">🛒 ${cartN()}</button></div>
<label class="search" style="margin-top:6px">🔍<input placeholder="Digite o nome do medicamento" value="${esc(p.q)}" oninput="V.ped.q=this.value;list()"></label>
<div class="tabs"><button class="tab ${p.cat?'':'on'}" onclick="V.ped.cat='';render()">Todos</button>${CAT.map(c=>`<button class="tab ${p.cat==c[0]?'on':''}" onclick="V.ped.cat='${c[0]}';render()">${c[1]} ${c[0]}</button>`).join('')}</div>
<div id="plist">${plist(L)}</div>
<h3>Envie sua Receita</h3><label class="empty" style="display:block">${V.rx?'📎 '+esc(V.rx):'📷 Tire uma foto ou envie sua receita<br><small>Formatos: JPG, PNG ou PDF</small>'}<input type="file" accept="image/*,.pdf" hidden onchange="V.rx=this.files[0]?.name||'';if(V.rx)toast('Receita anexada');render()"></label>
<h3>Meus últimos pedidos <button onclick="nav('orders')">Ver todos</button></h3>${ords.length?ords.map(oc).join(''):'<div class="empty">Nenhum pedido ainda.</div>'}`},
cart(){const rx=S.cart.some(c=>PROD.find(p=>p[0]==c.id)?.[3]);const tot=S.cart.reduce((a,c)=>a+c.q*prodPrice(c.id),0);

`<h3>Recebimento</h3><div class="form"><select id="mode"><option value="entrega">Entrega (R$ 6,00)</option><option value="retirada">Retirar na farmácia (grátis)</option></select></div>${rx&&!V.rx?'<p class="sub" style="margin-top:8px;color:var(--red)">Itens controlados exigem receita. Anexe na tela de pedidos.</p>':''}
<h3>Subtotal <b>${R(tot)}</b></h3><button class="btn" ${rx&&!V.rx?'disabled':''} onclick="checkout()">Ir para pagamento</button>`:'<div class="empty">Seu pedido está vazio.</div>'+'<button class="btn" onclick="nav(\'pedidos\')">Escolher medicamentos</button>')},
orders(){return head('Meus pedidos','pedidos')+(S.orders.length?S.orders.map(oc).join(''):'<div class="empty">Nenhum pedido ainda.</div>')},
consultas(){const L=SVC.filter(l=>l[3]==V.age);const up=S.appts.filter(a=>a.date+a.time>=ymd(new Date())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
return head('Agendar Consulta')+tabs('age',['Farmácia Clínica','Estética','Fitoterapia'])+L.map(l=>`<button class="card" onclick="agendar('${l[1]}')"><span class="ic">${l[0]}</span><div class="t"><b>${l[1]}</b><small>${l[2]}</small></div>›</button>`).join('')+
`<h3>Minhas consultas</h3>${up.length?up.map(a=>`<div class="card"><span class="ic">📅</span><div class="t"><b>${esc(a.svc)}</b><small>${br(a.date)} às ${a.time}</small></div><div style="display:flex;flex-direction:column;gap:6px"><button class="pill ok" onclick="reagendar('${a.id}')">Reagendar</button><button class="pill" onclick="verRecibo('${a.id}')">Recibo</button><button class="pill x" onclick="cancelAppt('${a.id}')">Cancelar</button></div></div>`).join(''):'<div class="empty">Nenhuma consulta marcada.</div>'}`},
meds(){const t=V.meds,ls=t=='Histórico'?S.hist:S.meds;

function saveWelcome(){const n=$('#wn').value.trim();if(n.length<2)return toast('Digite o nome do paciente');S.name=n;S.setup=1;S.notifs=S.notifs.filter(x=>x.id!='n0');notify('Dica: cadastre seus medicamentos e ative os lembretes para não esquecer nenhuma dose.');notify(`Olá, ${n}! Bem-vindo(a) ao Farma & Vida. Cuidar de você é o nosso propósito.`);close();render();toast('Olá, '+n+'!')}
function editName(){modal(`<h2>Alterar nome</h2><div class="form"><input id="en2" value="${esc(S.name)}" placeholder="Nome do paciente" onkeydown="if(event.key=='Enter')saveName()"></div><button class="btn" onclick="saveName()">Salvar</button><button class="btn o" onclick="close()">Cancelar</button>`);setTimeout(()=>$('#en2')&&$('#en2').focus(),100)}
function saveName(){const n=$('#en2').value.trim();if(n.length<2)return toast('Digite o nome do paciente');S.name=n;save();close();toast('Nome atualizado');render()}
const oc=o=>{const s=orderStatus(o);return `<button class="card" onclick="verNota('${o.id}')"><span class="ic">📦</span><div class="t"><b>${esc(o.items.map(i=>i[1]+'x '+i[0]).join(', '))}</b><small>${new Date(o.ts).toLocaleDateString('pt-BR')} · ${R(o.total)}</small></div><span class="pill ${s=='Entregue'?'ok':''}">${s}</span></button>`};
const plist=L=>L.length?L.map(p=>`<div class="card"><span class="ic">${CAT.find(c=>c[0]==p[1])[1]}</span><div class="t"><b>${p[0]}</b><small>${p[1]}${p[3]?' · exige receita':''} · ${R(p[2])}</small></div><button class="pill ok" onclick="add('${p[0]}')">Adicionar</button></div>`).join(''):'<div class="empty">Nenhum produto encontrado.</div>';
function list(){$('#plist').innerHTML=plist(PROD.filter(x=>(!V.ped.cat||x[1]==V.ped.cat)&&x[0].toLowerCase().includes(V.ped.q.toLowerCase())))}
function syncLabs(){S.labs.forEach(l=>{if(!l.res&&new Date(l.date+'T'+l.time)<new Date()){l.res=1;l.items.forEach(n=>S.exams.unshift({id:uid(),n,date:l.date,r:'Resultado liberado: valores dentro da referência (exemplo).'}));notify('Resultados disponíveis: '+l.items.join(', '))}})}
function render(){syncLabs();const s=SCR[V.scr]?V.scr:'inicio';$('#v').innerHTML=SCR[s]();const u=unread();
$('#nav').innerHTML=NAV.map(x=>`<button class="${x[0]==V.tab?'on':''}" onclick="nav('${x[0]}','${x[0]}')"><b>${x[1]}</b>${x[2]}${x[0]=='notif'&&u?`<i>${u}</i>`:''}${x[0]=='pedidos'&&cartN()?`<i>${cartN()}</i>`:''}</button>`).join('')}
function theme(){const d=document.documentElement;S.theme?d.dataset.theme=S.theme:delete d.dataset.theme}
function tile(k){const m={pedidos:['pedidos','pedidos'],meds:['meds','inicio'],consultas:['consultas','consultas'],ex:['ex','inicio'],lem:['lem','inicio'],an:['analises','inicio']};
if(k=='man'){V.ped.cat='Manipulados';return nav('pedidos','pedidos')}if(k=='fito'){V.age='Fitoterapia';return nav('consultas','consultas')}if(k=='est'){V.age='Estética';return nav('consultas','consultas')}
if(k=='mais')return modal(`<h2>Mais serviços</h2><button class="card" onclick="close();nav('orders','pedidos')"><span class="ic">📦</span><b>Meus pedidos</b></button><button class="card" onclick="close();nav('cart','pedidos')"><span class="ic">🛒</span><b>Meu carrinho (${cartN()})</b></button><button class="card" onclick="close();chat()"><span class="ic">💬</span><b>Suporte no aplicativo</b></button>`);
nav(...m[k])}
function busca(v){const r=v?PROD.filter(p=>p[0].toLowerCase().includes(v.toLowerCase())).slice(0,5):[];$('#res').innerHTML=r.map(p=>`<div class="card"><span class="ic">💊</span><div class="t"><b>${p[0]}</b><small>${R(p[2])}</small></div><button class="pill ok" onclick="add('${p[0]}')">Adicionar</button></div>`).join('')}
function add(n){const c=S.cart.find(x=>x.id==n);c?c.q++:S.cart.push({id:n,q:1});save();toast(n+' adicionado ao pedido');const q=$('#q');q?render():render()}
function qty(n,d){const c=S.cart.find(x=>x.id==n);c.q+=d;if(c.q<1)S.cart=S.cart.filter(x=>x!=c);save();render()}
function verNota(id){V.rec={k:'o',id};nav('nota','pedidos')}
function verRecibo(id){V.rec={k:'a',id};nav('nota','consultas')}
function copiaNota(){try{navigator.clipboard.writeText($('#nota').innerText);toast('Nota copiada')}catch(e){toast('Não foi possível copiar')}}
function confirmPay(){const p=V.pay,m=p.m||'pix',info={method:m,paidAt:Date.now(),status:m=='cash'||m=='clinic'?'Pendente':'Pago',proto:String(Date.now()).slice(-8)};
if(m=='card'){const n=$('#cn').value.replace(/\D/g,'');if(n.length<13||!$('#cnm').value.trim()||!/^\d\d\/\d\d$/.test($('#cv').value)||$('#cc').value.replace(/\D/g,'').length<3)return toast('Confira os dados do cartão');info.last4=n.slice(-4);info.inst=$('#ci').value}
const id=uid();if(p.kind=='order'){S.orders.unshift({id,items:S.cart.map(c=>[c.id,c.q]),total:p.total,sub:p.sub,frete:p.frete,ts:Date.now(),mode:p.mode,pay:info});S.cart=[];V.rx='';notify('Pedido confirmado! Total '+R(p.total))}
else if(p.kind=='lab'){S.labs.push({id,items:p.items,mode:p.mode,addr:p.addr,date:p.date,time:p.time,total:p.total,pay:info,res:0});V.an.sel=[];V.an.time='';notify(`Exames agendados para ${br(p.date)} às ${p.time}`)}
else{S.appts.push({id,svc:p.svc,date:p.date,time:p.time,price:p.total,pay:info});notify(`Consulta confirmada: ${p.svc}, ${br(p.date)} às ${p.time}`)}
V.rec={k:p.kind=='order'?'o':p.kind=='lab'?'l':'a',id};const t=p.kind=='order'?'pedidos':p.kind=='lab'?'inicio':'consultas';V.pay=null;save();toast(m=='cash'||m=='clinic'?'Agendamento confirmado!':'Pagamento confirmado!');nav('nota',t)}
function checkout(){const mode=$('#mode').value,sub=S.cart.reduce((a,c)=>a+c.q*prodPrice(c.id),0),frete=mode=='entrega'?6:0;V.pay={kind:'order',mode,sub,frete,total:sub+frete,desc:'Pedido de medicamentos',m:'pix'};nav('pay','pedidos')}
function checkoutOld(){const mode=$('#mode').value,sub=S.cart.reduce((a,c)=>a+c.q*prodPrice(c.id),0),total=sub+(mode=='entrega'?6:0);
S.orders.unshift({id:uid(),items:S.cart.map(c=>[c.id,c.q]),total,ts:Date.now(),mode});S.cart=[];V.rx='';notify('Pedido confirmado! Total '+R(total));save();toast('Pedido realizado!');nav('orders','pedidos')}
function reagendar(id){const a=S.appts.find(x=>x.id==id);agendar(a.svc,a.date,id)}
function agendar(svc,dsel,rid){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});dsel=dsel||ymd(days[0]);const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
modal(`<h2>${rid?'Reagendar: ':''}${esc(svc)}</h2><div class="tabs">${days.map(d=>`<button class="tab ${ymd(d)==dsel?'on':''}" onclick="agendar('${svc}','${ymd(d)}','${rid||''}')">${d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'})}</button>`).join('')}</div><div class="slots">${SLOTS.map(h=>{const off=S.appts.some(a=>a.id!=rid&&a.date==dsel&&a.time==h)||(dsel==ymd(now)&&h<=hm);return `<button class="tab" ${off?'disabled style="opacity:.4"':''} onclick="confirmAppt('${svc}','${dsel}','${h}','${rid||''}')">${h}</button>`}).join('')}</div><p class="sub">Toque em um horário para confirmar.</p>`)}
function confirmAppt(svc,date,time,rid){if(rid){const a=S.appts.find(x=>x.id==rid);a.date=date;a.time=time;notify(`Consulta reagendada: ${svc}, ${br(date)} às ${time}`);toast('Consulta reagendada!')}else{V.pay={kind:'appt',svc,date,time,total:PR[svc]||80,desc:'Consulta',m:'pix'};close();return nav('pay','consultas')}save();close();render()}
function cancelAppt(id){const a=S.appts.find(x=>x.id==id);modal(`<h2>Cancelar consulta?</h2><p style="margin-bottom:8px">${esc(a.svc)} · ${br(a.date)} às ${a.time}</p><button class="btn" style="background:var(--red)" onclick="doCancel('${id}')">Sim, cancelar</button><button class="btn o" onclick="reagendar('${id}')">Reagendar em vez disso</button><button class="btn o" onclick="close()">Manter consulta</button>`)}
function doCancel(id){const a=S.appts.find(x=>x.id==id);S.appts=S.appts.filter(x=>x.id!=id);notify(`Consulta cancelada: ${a.svc}, ${br(a.date)} às ${a.time}`);save();close();toast('Consulta cancelada');render()}
function editMed(id){const m=S.meds.find(x=>x.id==id)||{n:'',d:'1 comprimido',t:['08:00']};
modal(`<h2>${id?'Editar':'Novo'} medicamento</h2><div class="form"><input id="mn" placeholder="Nome (ex.: Losartana 50mg)" value="${esc(m.n)}"><input id="md" placeholder="Dose" value="${esc(m.d)}"><label class="sub">Horários (separe por vírgula)</label><input id="mt" value="${m.t.join(', ')}" placeholder="08:00, 20:00"></div><button class="btn" onclick="saveMed('${id||''}')">Salvar</button>${id?`<button class="btn o" onclick="finMed('${id}')">Finalizar tratamento</button><button class="btn o" style="color:var(--red);border-color:var(--red)" onclick="delMed('${id}')">Excluir</button>`:''}`)}
function saveMed(id){const n=$('#mn').value.trim(),t=$('#mt').value.split(',').map(s=>s.trim()).filter(s=>/^([01]?\d|2[0-3]):[0-5]\d$/.test(s)).map(s=>s.padStart(5,'0')).sort();if(!n||!t.length)return toast('Informe nome e horários válidos (HH:MM)');
const o={n,d:$('#md').value.trim()||'1 dose',t};if(id)Object.assign(S.meds.find(x=>x.id==id),o);else S.meds.push({id:uid(),on:1,i:'💊',...o});save();close();toast('Salvo');render()}
function finMed(id){const m=S.meds.find(x=>x.id==id);S.meds=S.meds.filter(x=>x!=m);S.hist.push(m);save();close();render()}
function delMed(id){S.meds=S.meds.filter(x=>x.id!=id);save();close();render()}
function reativar(id){const m=S.hist.find(x=>x.id==id);S.hist=S.hist.filter(x=>x!=m);S.meds.push(m);save();render()}
function tgl(id){const m=S.meds.find(x=>x.id==id);m.on^=1;save();toast(m.on?'Lembrete ativado':'Lembrete desativado');render()}
function done(k){const h=ymd(new Date());S.log[h]=S.log[h]||{};S.log[h][k]?delete S.log[h][k]:S.log[h][k]=1;save();render()}
function addLem(){modal(`<h2>Novo lembrete</h2><div class="form"><input id="ln" placeholder="O que lembrar?"><input id="ld" placeholder="Detalhe (opcional)"><input id="lt" type="time" value="09:00"></div><button class="btn" onclick="saveLem()">Salvar</button>`)}
function saveLem(){const n=$('#ln').value.trim();if(!n)return toast('Informe o nome');S.custom.push({id:uid(),n,d:$('#ld').value.trim(),t:$('#lt').value||'09:00',i:'⏰'});save();close();render()}
function addExame(){modal(`<h2>Novo laudo</h2><div class="form"><input id="en" placeholder="Nome do exame"><input id="ed" type="date" value="${ymd(new Date())}"><input id="ef" type="file" accept="image/*,.pdf"></div><button class="btn" onclick="saveEx()">Salvar</button>`)}
function saveEx(){const n=$('#en').value.trim()||$('#ef').files[0]?.name;if(!n)return toast('Informe o nome ou anexe um arquivo');S.exams.unshift({id:uid(),n,date:$('#ed').value,r:'Arquivo anexado: '+($('#ef').files[0]?.name||'sem anexo')});save();close();toast('Laudo salvo');render()}
function verLaudo(id){V.lau=id;nav('laudo','inicio')}
function printLaudo(id){verLaudo(id);setTimeout(()=>{try{window.print()}catch(e){toast('Impressão indisponível')}},400)}
function delLaudo(id){modal(`<h2>Excluir laudo?</h2><button class="btn" style="background:var(--red)" onclick="S.exams=S.exams.filter(x=>x.id!='${id}');save();close();nav('ex','inicio')">Sim, excluir</button><button class="btn o" onclick="close()">Manter</button>`)}
function readN(id){const n=S.notifs.find(x=>x.id==id);n.r=1;save();render()}
function chat(){const h=[['Equipe','Olá! Como podemos ajudar?']];const draw=()=>modal(`<h2>Suporte</h2>${h.map(m=>`<div class="card" style="${m[0]=='Você'?'background:var(--gl)':''}"><div class="t"><small>${m[0]}</small>${esc(m[1])}</div></div>`).join('')}<div class="form"><input id="cm" placeholder="Digite sua mensagem"></div><button class="btn" onclick="const v=$('#cm').value.trim();if(v){window._h.push(['Você',v],['Equipe','Recebemos sua mensagem. Um atendente responde em instantes.']);window._d()}">Enviar</button>`);window._h=h;window._d=draw;draw()}
setInterval(()=>{const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),day=ymd(d);window._al=window._al||{};
S.meds.filter(m=>m.on&&m.t.includes(hm)).forEach(m=>{const k=day+m.id+hm;if(!window._al[k]){window._al[k]=1;notify(`Hora de tomar ${m.n} (${m.d})`);toast('⏰ Hora de tomar '+m.n);try{Notification.permission=='granted'&&new Notification('Farma & Vida',{body:'Hora de tomar '+m.n})}catch(e){}render()}});
if(V.scr=='orders'&&!$('#ov'))render()},20000);
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function icon(n){const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,n,n);g.addColorStop(0,'#2e9e56');g.addColorStop(1,'#14602f');x.fillStyle=g;x.fillRect(0,0,n,n);x.fillStyle='#fff';const a=n*.14,b=n*.36,m=n/2;x.fillRect(m-a,m-b,2*a,2*b);x.fillRect(m-b,m-a,2*b,2*a);x.fillStyle='#9ccf6a';x.beginPath();x.ellipse(m+b*.7,m-b*.7,n*.1,n*.05,-Math.PI/4,0,7);x.fill();return c.toDataURL('image/png')}
try{const i1=icon(192),i5=icon(512),l=document.createElement('link');l.rel='apple-touch-icon';l.href=i5;document.head.append(l);
const man={name:'Farma & Vida',short_name:'Farma&Vida',description:'Saúde em todas as fases da vida',start_url:location.href.split('#')[0],scope:new URL('.',location.href).href,display:'standalone',display_override:['standalone'],orientation:'portrait',background_color:'#f3f8f2',theme_color:'#1c7a3e',lang:'pt-BR',icons:[{src:i1,sizes:'192x192',type:'image/png',purpose:'any'},{src:i5,sizes:'512x512',type:'image/png',purpose:'any'}]};
const m=document.createElement('link');m.rel='manifest';m.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.append(m)}catch(e){}
let DP=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e});window.addEventListener('appinstalled',()=>{DP=null;toast('Aplicativo instalado!');render()});
async function installApp(){if(isApp())return toast('O aplicativo já está instalado');if(DP){DP.prompt();await DP.userChoice;DP=null;return}
modal(`<h2>Instalar aplicativo</h2><p style="margin-bottom:8px"><b>Android (Chrome):</b> menu ⋮ → <i>Instalar app</i> ou <i>Adicionar à tela inicial</i>.</p><p style="margin-bottom:8px"><b>iPhone (Safari):</b> botão Compartilhar → <i>Adicionar à Tela de Início</i>.</p><p class="sub">Abra este link diretamente no navegador (não dentro de outro app ou de uma pré-visualização) para a instalação aparecer.</p><button class="btn" onclick="close()">Entendi</button>`)}
function askClose(){modal(`<h2>Fechar o aplicativo?</h2><p style="margin-bottom:8px;color:var(--mut)">Seus dados ficam salvos neste aparelho.</p><button class="btn" style="background:var(--red)" onclick="closeApp()">Sim, fechar</button><button class="btn o" onclick="close()">Continuar no app</button>`)}
function closeApp(){window._exit=1;close();try{window.close()}catch(e){}
setTimeout(()=>{document.body.innerHTML='<div style="margin:auto;text-align:center;padding:24px"><div class="brand">Farma <span style="color:#7aa84a">&amp;</span> <i>Vida</i></div><p style="margin:12px 0;color:var(--mut)">Aplicativo fechado.<br>Você já pode sair com segurança.</p><button class="btn" onclick="location.reload()">Abrir novamente</button></div>'},250)}
function appBack(){if(!S.setup)return;if($('#ov'))return close();const pr={cart:'pedidos',orders:'pedidos',pay:V.pay?.kind=='order'?'cart':V.pay?.kind=='lab'?'analises':'consultas',nota:V.rec?.k=='o'?'orders':V.rec?.k=='l'?'analises':'consultas',laudo:'ex'};
if(V.scr=='inicio')return toast('Para sair, toque em ✕ Fechar');const t=pr[V.scr]||'inicio';nav(t,['cart','orders','pedidos'].includes(t)?'pedidos':['consultas'].includes(t)?'consultas':'inicio')}
history.replaceState({fv:0},'');history.pushState({fv:1},'');window.addEventListener('popstate',()=>{history.pushState({fv:1},'');appBack()});
window.addEventListener('beforeunload',e=>{if(isApp()&&!window._exit){e.preventDefault();e.returnValue=''}});
theme();render();if(!S.setup)welcome();try{Notification.permission=='default'&&Notification.requestPermission()}catch(e){}
</script></body></html>
